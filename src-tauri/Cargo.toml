[package]
name = "shadow-tracker"
version = "1.5.0"
description = "Shadow Tracker - Gamified Habit, Task & Focus Telemetry Matrix"
authors = ["Shadow Tracker Software"]
license = "MIT"
repository = "https://github.com/shadow-tracker/app"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["time"] }
