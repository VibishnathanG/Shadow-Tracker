version: '3.8'

services:
  # Development container with hot reloading
  dev:
    container_name: shadow-tracker-dev
    image: shadow-tracker:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: deps # build up to deps stage
    command: npm run dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_TELEMETRY_DISABLED=1

  # Production container (built and served optimized standalone)
  prod:
    container_name: shadow-tracker-prod
    image: shadow-tracker:prod
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_TELEMETRY_DISABLED=1
    restart: always
