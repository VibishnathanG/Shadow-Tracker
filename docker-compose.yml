version: '3.8'

services:
  # Development container with hot reloading
  dev:
    container_name: shadow-tracker-dev
    image: shadow-tracker:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    command: npm run dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_TELEMETRY_DISABLED=1

  # Production container (optimized nginx static serve)
  prod:
    container_name: shadow-tracker-prod
    image: vibishnathang/shadow-tracker:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    ports:
      - "8081:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "com.shadow-tracker.description=Shadow Tracker Production"
      - "com.shadow-tracker.version=1.3.0"
